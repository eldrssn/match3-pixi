<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Обычная страница: без `viewport-fit=cover` браузер сам держит контент
      вне выреза и home-индикатора, и `env(safe-area-inset-*)` здесь ноль.
      Отступы под вырез задаёт хост, в который встраивают игру (`insets` у
      экрана партии).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Match-3: собери три в ряд и пройди все уровни" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/dl-games.png" />
    <link
      rel="preload"
      href="/fonts/Nunito-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Nunito-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Match-3</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
