worker_processes auto;

events {
    worker_connections 2048; # Увеличить число соединений
    multi_accept on; # Принимать несколько соединений за раз
}

http {
    # Основные настройки
    include mime.types;
    default_type application/octet-stream;
    sendfile on; # Оптимизация передачи файлов
    tcp_nopush on; # Уменьшить фрагментацию пакетов
    tcp_nodelay on; # Ускорить передачу небольших пакетов
    keepalive_timeout 65; # Таймаут keep-alive соединений
    types_hash_max_size 4096; # Оптимизация таблицы MIME-типов

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    log_format json escape=json
        '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

  server {
    root /usr/share/nginx/html/;
    listen 8080 default_server;
    server_name _;

    set $MAIN_INDEX '/index.html';
    index $MAIN_INDEX;

    # CORS Headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Health check endpoint (без логирования)
    location /healthz {
        access_log off;
        error_log off;
        return 200 '{"status": "ok", "version": "1.0.0", "timestamp":$msec,"service":"nginx"}';
        add_header Content-Type application/json;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location /metrics {
        proxy_pass http://127.0.0.1:9113/metrics;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Page
    location / {
        # Обработка предварительных CORS-запросов
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        try_files $uri $MAIN_INDEX =404;
        # Disable caching
        add_header Last-Modified $date_gmt;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        if_modified_since off;
        expires off;
        etag off;
    }
  }
}